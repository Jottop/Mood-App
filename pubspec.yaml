publish_to: 'none'
version: 0.4.16+29
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.17.2
  characters: ^1.3.0
  home_widget: ^0.9.4
  workmanager: ^0.10.10
  package_info_plus: ^10.2.1
  http: ^1.6.0
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoEmoji-Regular.ttf

# Icono del launcher: la imagen fuente va en assets/icon/app_icon.png
# (PNG cuadrado, ideal 1024x1024, arte centrado en el ~66% medio para el
# recorte adaptativo). Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FBEEDC"
  adaptive_icon_foreground: assets/icon/app_icon.png
  min_sdk_android: 21
